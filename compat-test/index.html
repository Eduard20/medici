<!doctype html><meta charset="utf-8"><title>Async OMR compatibility test</title>
<h1>Async OMR compatibility test</h1><p>Original synthetic score only. No uploaded personal score. JSPI is explicitly unavailable in the test worker.</p>
<button id="start">Run real PDF test without JSPI</button><pre id="log"></pre>
<script src="../vendor/midi.js"></script><script src="../musicxml-midi.js"></script>
<script type="module">
const log=s=>{document.getElementById('log').textContent+=s+'\n';console.log(s)};
document.getElementById('start').onclick=async()=>{
 document.getElementById('start').disabled=true;
 try {
 const lib=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.min.mjs');
 lib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.worker.min.mjs';
 const doc=await lib.getDocument({data:new Uint8Array(await(await fetch('scale.pdf')).arrayBuffer())}).promise;
 const page=await doc.getPage(1),base=page.getViewport({scale:1}),vp=page.getViewport({scale:Math.min(2480/base.width,3508/Math.max(base.width,base.height))});
 const canvas=document.createElement('canvas');canvas.width=Math.round(vp.width);canvas.height=Math.round(vp.height);
 await page.render({canvas,viewport:vp,background:'#fff'}).promise;
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));const image=await blob.arrayBuffer();
 log('PDF rendered: '+canvas.width+' × '+canvas.height);
 const w=new Worker('omr-worker.js'+location.search,{type:'module'});
 w.onmessage=({data})=>{
  if(data.type==='progress'&&data.stage==='download')return;
  if(data.type==='result'){
   const output=MediciMusicXML.parsePages([data.xml],{tempo:100,title:'Synthetic test'});
   log('PASS: real PDF → MusicXML → MIDI; '+JSON.stringify(output.summary));
   const midi=new Midi(output.bytes);log('PITCHES: '+midi.tracks.flatMap(t=>t.notes.map(n=>n.midi)).join(','));
   log('TIME_MS: '+data.ms);w.terminate();return;
  }
  log(JSON.stringify(data));
  if(data.type==='ready')w.postMessage({type:'recognise',id:1,image},[image]);
 };
 w.onerror=e=>log('ERROR: '+e.message);
 w.postMessage({type:'init'});
 }catch(e){log('ERROR: '+e.message)}
};
</script>
